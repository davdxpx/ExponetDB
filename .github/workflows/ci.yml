# CI (implementation-waves.md, G1 and G2): every check a contributor runs
# with `bun run verify`, on clean runners, plus the lockfile, the dependency
# audit, the golden history guard and a clean working tree after everything
# ran.
#
# Supply chain (G1 A10, Wave 2): every action is pinned to a full commit SHA
# of its official repository, with the release it was taken from as a
# comment. To update one, read the release's commit from the official
# repository (`git ls-remote https://github.com/<owner>/<repo> refs/tags/<tag>`;
# for an annotated tag use the peeled `^{}` line), check that the object is a
# commit, and replace SHA and comment together. `bun run boundaries` refuses
# an action that is not pinned to a full SHA.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  typescript:
    name: TypeScript (lint, types, tests, contracts, boundaries)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # Full history: the golden history guard reads the base commit.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Install (lockfile must be current)
        run: bun install --frozen-lockfile

      - name: Lint and format (Biome)
        run: bunx biome ci .

      - name: Typecheck
        run: bun run typecheck

      - name: Unit, contract, golden and generator tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Generated artifacts are deterministic and committed
        run: bun run verify:generated

      - name: Golden vectors are locked and append-only
        run: bun run golden:check

      # G1 freeze: no locked vector, file member or lock entry of the base
      # changes. Pull requests compare with their base commit; pushes to main
      # with the previous head of main. A base that cannot be read fails.
      - name: Golden history is immutable
        env:
          GOLDEN_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bun run golden:history "$GOLDEN_BASE"

      # G4 freeze (gates/4.md §10): the acceptance and freeze commit is a
      # second, fixed base, so fp1, its vectors and the Wave 4 bundles stay
      # guarded in a diff whose base does not contain the freeze yet (Wave 5
      # starts from it). It must stay reachable: merge, never squash, the
      # pull request that carries it.
      - name: Golden history is immutable since the G4 freeze
        run: bun run golden:history 6e556f6b5a26ba141f600d38f612134af3600e49

      - name: Package boundaries
        run: bun run boundaries

      - name: Secret scan
        run: bun run secrets

      - name: Dependency audit
        run: bun audit

      - name: Working tree is unchanged
        run: |
          status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$status" ]; then
            echo "$status"
            echo "::error::a CI step changed or created tracked files"
            exit 1
          fi

  postgres:
    name: PostgreSQL integration (Control Store on 17; managed targets on 16, 17, 18)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      # Wave 5: the agent end-to-end test builds the real Go agent (with the
      # e2e test seams only) and runs it against the gateway and worker roles.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: agent/node/go.mod
          cache: false

      # A disposable server with a password generated for this run only. Real
      # PostgreSQL, never an emulation (P-2); the image is pinned by digest.
      - name: Start PostgreSQL 17
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          docker run -d --name exdb-pg17 -e POSTGRES_PASSWORD="$password" \
            -p 127.0.0.1:55432:5432 \
            postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
          # Wait for the final server: during initialization the image runs a
          # temporary server on the Unix socket only, which pg_isready also
          # accepts, and restarts it afterwards. Only the final server listens
          # on TCP, so readiness is a TCP query.
          for _ in $(seq 1 90); do
            docker exec exdb-pg17 psql -h 127.0.0.1 -U postgres -tAc 'SELECT 1' >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec exdb-pg17 psql -h 127.0.0.1 -U postgres -tAc 'SELECT version()'
          printf 'EXDB_TEST_PG_URL=postgres://%s:%s@127.0.0.1:55432/postgres\n' postgres "$password" >> "$GITHUB_ENV"

      # versitygw (Apache-2.0) as the S3-compatible endpoint of the audit
      # checkpoint export contract, with a root key generated for this run
      # only. It proves the protocol, not a real off-host store.
      - name: Start an S3-compatible test server
        run: |
          secret="$(openssl rand -hex 24)"
          echo "::add-mask::$secret"
          docker run -d --name exdb-s3 -e ROOT_ACCESS_KEY=exdbtest -e ROOT_SECRET_KEY="$secret" \
            --tmpfs /data -p 127.0.0.1:57070:7070 \
            versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499 \
            --port :7070 posix /data
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:57070/ && break
            sleep 1
          done
          {
            echo "EXDB_TEST_S3_ENDPOINT=http://127.0.0.1:57070"
            echo "EXDB_TEST_S3_ACCESS_KEY=exdbtest"
            echo "EXDB_TEST_S3_SECRET_KEY=$secret"
          } >> "$GITHUB_ENV"

      # Wave 4: the managed-target servers, PostgreSQL 16, 17 and 18 with
      # pgvector, TLS only (hostssl + scram-sha-256, plaintext rejected), with
      # a CA generated for this run, and one server without TLS for the
      # plaintext-refusal tests. Images pinned by digest in the script.
      - name: Start the managed-target servers (PostgreSQL 16, 17, 18 with TLS)
        run: |
          out="$RUNNER_TEMP/exdb-targets"
          bash tooling/dev/targets.sh "$out"
          echo "EXDB_TEST_TARGETS=$out/targets.json" >> "$GITHUB_ENV"

      - name: Install (lockfile must be current)
        run: bun install --frozen-lockfile

      - name: Integration tests against PostgreSQL 17 and the managed-target matrix
        run: bun run test:integration

  browser:
    name: Browser end-to-end (Chromium, virtual WebAuthn authenticator, PostgreSQL 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Start PostgreSQL 17
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          docker run -d --name exdb-pg17 -e POSTGRES_PASSWORD="$password" \
            -p 127.0.0.1:55432:5432 \
            postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
          # Wait for the final server: during initialization the image runs a
          # temporary server on the Unix socket only, which pg_isready also
          # accepts, and restarts it afterwards. Only the final server listens
          # on TCP, so readiness is a TCP query.
          for _ in $(seq 1 90); do
            docker exec exdb-pg17 psql -h 127.0.0.1 -U postgres -tAc 'SELECT 1' >/dev/null 2>&1 && break
            sleep 1
          done
          printf 'EXDB_TEST_PG_URL=postgres://%s:%s@127.0.0.1:55432/postgres\n' postgres "$password" >> "$GITHUB_ENV"

      - name: Install (lockfile must be current)
        run: bun install --frozen-lockfile

      # The Chromium build that belongs to the pinned playwright-core
      # (apps/server devDependency), from the Playwright download service.
      - name: Install Chromium for the pinned Playwright
        run: node apps/server/node_modules/playwright-core/cli.js install --with-deps chromium

      - name: Build the Web App
        run: bun run --cwd apps/web build

      # The suite runs the shipped CLI (apps/cli/dist) with Node as its own process.
      - name: Build the CLI
        run: bunx turbo run build --filter=@exponetdb/cli

      # G3A item 27: first-owner setup, passkey registration and sign-in,
      # logout, forged challenge, foreign origin, passkey re-authentication
      # with session rotation, password + TOTP, recovery code. G3B: CLI
      # loopback sign-in through the consent page, DCR approval with an
      # untrusted client name and refresh reuse, the device flow, service
      # account keys and an API key shown once. Never skipped.
      - name: Browser end-to-end tests
        run: bun run --cwd apps/server test:e2e

  image:
    name: Image (build, three roles from one image)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Base images are pinned by digest in the Dockerfile; the commit is the
      # only build input that varies.
      - name: Build the image
        run: docker build --build-arg EXPONETDB_BUILD_COMMIT="${GITHUB_SHA}" -t exponetdb:ci .

      - name: Image runs as a non-root user
        run: test "$(docker image inspect exponetdb:ci --format '{{.Config.User}}')" = node

      - name: Role-start smoke test (bootstrap, migrate, serve, worker, gateway, shutdown)
        run: bash tooling/smoke/roles.sh exponetdb:ci

  go:
    name: Go (conformance, protocol types, node agent)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent/node
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: agent/node/go.mod
          cache: false

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            echo "::error::files are not gofmt-formatted"
            exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          go vet -tags e2e ./cmd/...

      - name: Golden vectors, protocol fixtures and the node agent (race detector)
        run: go test -race -count=1 ./...

      - name: Bounded fuzzing of the journal
        run: go test -run=NONE -fuzz=FuzzOpen -fuzztime=20s ./internal/journal

      - name: Build the agent
        run: go build -trimpath -o /dev/null ./cmd/exponetdb-node
