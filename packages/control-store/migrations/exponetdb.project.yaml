# The Control Store's own migration stream (control-database.md §5). Real
# ExponetDB bundles, validated and digested by migrations/format, ordered by
# migrations/graph, applied by `exponetdb control-store migrate` as exdb_migrate.
schema: exponetdb.project/v1
project: exponetdb/control-store
layout: bundles
defaults:
  lockTimeout: 5s
  statementTimeout: 5m
  role: migrate
  searchPath: ["pg_catalog"]
executionRoles:
  migrate: exdb_migrate
managedScope:
  includeSchemas: ["control", "audit", "secrets", "policy", "operations", "auth", "approvals", "oauth", "registry", "observation"]
  excludeSchemas: []
lintProfile: strict
