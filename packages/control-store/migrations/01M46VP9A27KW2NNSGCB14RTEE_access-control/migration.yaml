name: access-control
description: |
  Role-based access control (authorization.md §3, Wave 3A): the six
  built-in roles with explicit permission lists (no wildcard; a new catalog
  permission is held by no role until a later bundle adds it), role
  bindings at global, product, project, environment and target scope, the
  last-owner invariant enforced in the database, and the one-time
  activation of the first owner.
