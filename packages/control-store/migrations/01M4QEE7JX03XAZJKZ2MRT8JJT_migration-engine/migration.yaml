name: migration-engine
description: |
  The migration engine's records (Wave 6): the bundle store (every ingested
  revision's exact bytes, immutable), the mirror of each target's ledger and
  verification runs, the per-migration progress of migration operations, and
  each project's execution role aliases and trusted extensions as registry
  data. Additive: new schema, new tables, two new columns on
  registry.projects with defaults; no existing row changes.
