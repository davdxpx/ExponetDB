schema: exponetdb.migration/v1
id: 01M4S5TDSB5ZXPJCBFKF8WRT5C
name: mcp-keys
description: |
  Two installation keys of the MCP endpoint (Wave 7, ADR-0027 §7): one
  seals the list cursors handed to agents (bound to the grant, the tool, the
  filters and an expiry), the other seals the requestState of the approval
  round of plan_apply. Each is a secret of the auth consumer, named in
  auth.installation_keys like the existing keys (domain separation: a value
  sealed with one is never accepted by the other). Additive: one CHECK
  constraint accepts two more values; no table, column or row changes.
dependsOn:
  - 01M4R66846BD63S51NS15EZKB1
execution:
  transactional: true
compatibility:
  declared: additive
verification:
  expectations: auto
  runtimeChecks: verify.sql
