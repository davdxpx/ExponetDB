name: nodes
description: |
  The node agent's control plane (control-plane.md, Wave 5): the agent PKI
  certificates, job-signing keys, enrollment tokens, nodes and jobs, in a
  schema of its own that the gateway may use. Gateway writes go through
  functions that check the node's current certificate, its state and the
  transition; the worker binds node keys, signs jobs and judges results.
