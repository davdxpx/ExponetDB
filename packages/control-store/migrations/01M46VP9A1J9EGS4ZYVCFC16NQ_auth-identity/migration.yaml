name: auth-identity
description: |
  Identity and authentication state (identity.md, Wave 3A): identities,
  identity providers and external subjects (federation-ready, local only),
  authentication factors, recovery codes, one-time links, ceremony
  challenges, Web sessions, re-authentication evidence, authentication rate
  limits, the security notification outbox and references to the
  installation's auth keys. Bearer-style secrets are stored only as hashes;
  TOTP secrets live in the secrets store (consumer auth).
