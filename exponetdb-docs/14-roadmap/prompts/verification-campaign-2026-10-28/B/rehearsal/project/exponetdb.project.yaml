schema: exponetdb.project/v1
project: lab/platform
layout: legacy+bundles
defaults:
  lockTimeout: 5s
  statementTimeout: 15m
  role: owner
  searchPath: [public]
executionRoles:
  owner: lab_owner
managedScope:
  includeSchemas: [public, auth, storage, app_private]
  excludeSchemas: []
lintProfile: strict
bundleRoots:
  - migrations
legacy:
  directory: legacy
  baseline: baseline:rehearsal-2024
