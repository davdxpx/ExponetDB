# The agent's state directory (architecture.md §1, state.go): owned by the agent's user, mode 0700.
# The unit's StateDirectory= creates it only when the unit starts, but a fresh host enrolls the node
# (`exponetdb-node enroll`, node-runbook.md §3) before that, and the agent refuses to open a state
# directory that does not exist (test campaign TC-039). `systemd-tmpfiles --create` makes it, with
# the same owner and mode the unit gives it.
d /var/lib/exponetdb-node 0700 exponetdb-node exponetdb-node -
