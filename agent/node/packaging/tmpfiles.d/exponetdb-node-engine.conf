# The engine runs of the backup and restore capabilities (ADR-0037): root's
# run records and the scratch restores, traversable by the PostgreSQL user
# (0711, never listable or writable by it). Not the agent's state directory:
# a less trusted user must not own the parent of root's run records.
d /var/lib/exponetdb-node-engine 0711 root root -
d /var/lib/exponetdb-node-engine/runs 0711 root root -
d /var/lib/exponetdb-node-engine/scratch 0711 root root -
d /var/lib/exponetdb-node-engine/reads 0711 root root -
